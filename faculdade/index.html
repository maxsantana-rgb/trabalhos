<!DOCTYPE html>
<html lang="pt-BR">

    <title>Jogo de Adivinhar</title>
    <link rel="stylesheet" href="atividade.css">
</head>
<body>
    <header>
        <h1>Jogo de Adivinhar</h1>
    </header>
    <main>

        <label for="jogo">Digite um número de 1 a 100:</label>

        <button id="adivinhar">adivinhar</button>
        <p id="mensagem"></p>
        <p id="tentativas"></p>
        <script src="script.js"></script>
        

    </main>

</html>
